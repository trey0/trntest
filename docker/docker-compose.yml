# Every value below defaults to this repo's traditional single-checkout layout (repo at
# <workspace>/src/trntest, port 8888, cache/output/scratch as its direct siblings). A Claude Code
# worktree checkout (`.claude/worktrees/<name>/`, see docs/environment.md's "Multi-agent
# worktrees" section) sits three directories deeper, so its relative mount paths resolve to the
# wrong place, and it needs its own image tag/project name so concurrent `docker compose run --rm`
# invocations across worktrees don't stomp each other's image build. Run
# `scripts/setup_worktree_docker_env.sh` once per worktree to generate the gitignored `docker/.env`
# that supplies the overrides below -- see that script and docs/environment.md for what it writes
# and why. The main checkout needs no `docker/.env` at all; these defaults already suit it.
name: ${COMPOSE_PROJECT_NAME:-trntest}

services:
  demo:
    build:
      # Build context is the repo root, not this docker/ dir -- the Dockerfile now COPYs the whole
      # repo in (for the editable `pip install -e`), which needs pyproject.toml/src/ in scope.
      context: ..
      dockerfile: docker/Dockerfile
    image: ${TRNTEST_IMAGE_TAG:-trntest-lunar-demo}
    volumes:
      - ..:/workspace
      # cache/output/scratch live outside this repo entirely, as siblings of the outer workspace's
      # `src/` (ROS-workspace-inspired out-of-source layout: this repo is expected at
      # <workspace>/src/trntest). cache/scratch are meant to be *shared* across every checkout of
      # this repo (main + all worktrees) -- re-fetching SPICE kernels/WMS tiles per worktree would
      # be wasteful; output is meant to be *per-worktree* so concurrent agents don't clobber each
      # other's rendered demo artifacts. If you've cloned this repo somewhere else, or these
      # defaults land in the wrong place, override via TRNTEST_HOST_CACHE_DIR/
      # TRNTEST_HOST_OUTPUT_DIR/TRNTEST_HOST_SCRATCH_DIR (`docker/.env`, see
      # scripts/setup_worktree_docker_env.sh), or set TRNTEST_CACHE_ROOT/TRNTEST_OUTPUT_DIR/a
      # trntest.toml to bypass these mounts entirely -- see README's Configuration section.
      - ${TRNTEST_HOST_CACHE_DIR:-../../../cache}:/workspace/cache
      - ${TRNTEST_HOST_OUTPUT_DIR:-../../../output}:/workspace/output
      # Large, disposable intermediate files (e.g. the ISIS/CSM WAC reprojection spike's
      # intermediate cubes) go here, not output/ -- see docs/environment.md.
      - ${TRNTEST_HOST_SCRATCH_DIR:-../../../scratch}:/workspace/scratch
      # A linked git worktree's `.git` is a FILE pointing at the main checkout's real `.git` dir by
      # absolute host path (e.g. `gitdir: /root/trntest_ws/src/trntest/.git/worktrees/a1`) -- that
      # path isn't covered by the `..:/workspace` mount above (it lives outside this worktree's own
      # directory entirely), so any git command inside this container fails ("not a git repository")
      # unless that same absolute path is *also* mounted here. `TRNTEST_MAIN_GIT_DIR`
      # (`scripts/setup_worktree_docker_env.sh`, worktrees only) supplies it -- source and target are
      # the same real path on purpose, since that's the literal string git's own worktree admin files
      # expect to resolve. The main checkout needs no such mount (its `.git` is a real directory
      # already covered above) -- the default here just re-mounts `..` at an unused throwaway path,
      # safe and inert.
      - ${TRNTEST_MAIN_GIT_DIR:-..}:${TRNTEST_MAIN_GIT_DIR:-/tmp/trntest-unused-git-mount}:ro
    ports:
      # Bound to loopback only — this host has a public IP and the Jupyter server below runs with
      # no auth token. Reach it via an SSH tunnel: ssh -L <port>:localhost:<port> <this-host>. In
      # practice no agent works directly in the main checkout, and the user doesn't run a
      # persistent server there either -- each active worktree agent runs its own `docker compose
      # up` server instead (so the user can watch that agent's `scripts/run_notebook.sh` runs
      # live), alongside `docker compose run --rm demo <cmd>` for one-off commands, needing a
      # *different* port so concurrent agents' servers don't collide -- `scripts/
      # setup_worktree_docker_env.sh` writes TRNTEST_JUPYTER_PORT into that worktree's own
      # docker/.env following the convention `8887 + <agent number>` (the worktree name's own
      # trailing digit(s), e.g. "a1" -> 8888, "a2" -> 8889) -- see docs/environment.md's
      # "Multi-agent worktrees" section. The `:-8888` default below is just the main checkout's own
      # unvaried port, not a claim that anything is actually listening there.
      - "127.0.0.1:${TRNTEST_JUPYTER_PORT:-8888}:8888"
    working_dir: /workspace
