[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "trntest"
version = "0.1.0"
description = "SPICE-posed synthetic lunar satellite imagery demo, compared against real LROC WAC imagery"
readme = "README.md"
license = "MIT-0"
requires-python = ">=3.11"
dependencies = [
    "requests",
    "spiceypy",
    "numpy",
    "rasterio",
    "matplotlib",
    "pandas",
    "rioxarray",
    "geopandas",
]

[project.optional-dependencies]
dev = [
    "ruff",
    "mypy",
    "pytest",
    "jupytext",
    "jupyterlab",
    "ipykernel",
]

[project.scripts]
trntest-lint = "trntest._lint:main"

[tool.hatch.build.targets.wheel]
packages = ["src/trntest"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "PL"]
# PLR0913/PLR0917 (too many function arguments/positional args): this is pinhole-camera math
# ported faithfully from working code, where each scalar (fu, fv, cu, cv, individual coordinates)
# has a distinct physical meaning -- bundling them into a wrapper struct would be an abstraction
# added purely to satisfy the linter, not for any real clarity/correctness benefit, and would
# ripple across many call sites. Disabled project-wide rather than fought locally at each of the
# ~8 call sites this hits.
ignore = ["PLR0913", "PLR0917"]

[tool.ruff.lint.per-file-ignores]
# PLR2004 (magic value in comparison): normal and expected in test assertions, which compare
# against literal expected values by design -- not a code smell there the way it can be elsewhere.
"tests/*" = ["PLR2004"]
# E501 (line too long): markdown cells carry long prose lines as comments -- wrapping prose to fit
# a code line-length limit doesn't serve the same purpose it does for actual code.
# B018 (useless expression): a bare trailing expression is the standard Jupyter idiom for
# displaying a value as a cell's output -- intentional, not a mistake.
# E703 (unnecessary semicolon): a trailing `;` is how Jupyter/IPython suppresses auto-display of a
# cell's last expression (e.g. to hide a plot call's Axes repr) -- meaningful here, unlike scripts.
"notebooks/*" = ["E501", "B018", "E703"]

[tool.mypy]
# Matches the actual interpreter this project runs under (confirmed 3.13.13 in the Docker image),
# not `requires-python`'s 3.11 floor (set only for stdlib tomllib) -- numpy's own bundled stubs use
# 3.12+ syntax (PEP 695 type statements) that mypy can't parse when python_version is set below
# that, regardless of this project's own code.
python_version = "3.13"
warn_redundant_casts = true
warn_unused_ignores = true
warn_unused_configs = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["spiceypy.*", "rasterio.*", "pandas.*"]
ignore_missing_imports = true
