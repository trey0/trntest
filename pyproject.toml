[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "trntest"
version = "0.1.0"
description = "SPICE-posed synthetic lunar satellite imagery demo, compared against real LROC WAC imagery"
readme = "README.md"
license = "MIT-0"
requires-python = ">=3.11"
dependencies = [
    "requests",
    "spiceypy",
    "numpy",
    "rasterio",
    "matplotlib",
    "pandas",
    "rioxarray",
    "geopandas",
    "pvl",
    "ipython",
    "pillow",
    "affine",
    "opencv-python-headless",
    # CPU-only wheels -- installed from PyTorch's own CPU index in a dedicated Docker layer *before*
    # this project's own `uv pip install -e .`, so the resolver doesn't pull PyPI's default
    # CUDA-bundled build (huge, unusable without a GPU/NVIDIA driver, neither present in this
    # container). See docker/Dockerfile and docs/data-sources.md's "LightGlue tie-point matching"
    # section. `kornia` (plain PyPI, no special index) is `lightglue`'s own real runtime dependency
    # (its DISK extractor loads pretrained weights via `kornia.feature.DISK.from_pretrained`) --
    # listed here, not left to `lightglue`'s own requirements.txt, since that file also declares
    # `opencv-python` (conflicts with `opencv-python-headless` above -- both provide `cv2`) and an
    # independently-pinned `kornia` version; `lightglue` itself is installed `--no-deps` for exactly
    # this reason (Dockerfile only, deliberately not listed here -- see that file's comment).
    "torch",
    "torchvision",
    "kornia",
]

[project.optional-dependencies]
dev = [
    "ruff",
    "mypy",
    "pytest",
    "jupytext",
    "jupyterlab",
    "ipykernel",
    "papermill",
    "nbformat",
]

[project.scripts]
trntest-lint = "trntest._lint:main"

[tool.hatch.build.targets.wheel]
packages = ["src/trntest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# "heavy" tests need live network access -- SPICE kernels (e.g. maneuver_detection.py's real-SPK
# tests) or a pretrained-weight download (e.g. pose_alignment.py's LightGlue tests, first-run only,
# cached under TORCH_HOME after) -- excluded by default so plain `pytest` stays fast/host-runnable
# (see README's Tests section); run them with `scripts/run_heavy_tests.sh` (inside Docker) or
# `pytest -m heavy` directly, which overrides this default (a later -m wins over addopts' earlier
# one).
addopts = "-m 'not heavy'"
markers = ["heavy: needs live network access (NAIF SPICE, or a pretrained-weight host); run inside Docker"]

[tool.ruff]
line-length = 120
target-version = "py311"
# old_notebooks/ is a frozen archive of throwaway diagnostic notebooks (real executed output kept,
# not re-run or kept in sync going forward -- see its own README.md) -- genuinely out of scope for
# ongoing lint, not just a one-time pass. `_lint.py`'s own notebook pairing/sync checks already
# exclude it by only scanning `notebooks/`; this does the same for the general ruff format/check
# pass, which otherwise picks up any new/changed .py file regardless of directory.
exclude = ["old_notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "PL"]
# PLR0913/PLR0917 (too many function arguments/positional args): this is pinhole-camera math
# ported faithfully from working code, where each scalar (fu, fv, cu, cv, individual coordinates)
# has a distinct physical meaning -- bundling them into a wrapper struct would be an abstraction
# added purely to satisfy the linter, not for any real clarity/correctness benefit, and would
# ripple across many call sites. Disabled project-wide rather than fought locally at each of the
# ~8 call sites this hits.
ignore = ["PLR0913", "PLR0917"]

[tool.ruff.lint.per-file-ignores]
# PLR2004 (magic value in comparison): normal and expected in test assertions, which compare
# against literal expected values by design -- not a code smell there the way it can be elsewhere.
"tests/*" = ["PLR2004"]
# E501 (line too long): markdown cells carry long prose lines as comments -- wrapping prose to fit
# a code line-length limit doesn't serve the same purpose it does for actual code.
# B018 (useless expression): a bare trailing expression is the standard Jupyter idiom for
# displaying a value as a cell's output -- intentional, not a mistake.
# E703 (unnecessary semicolon): a trailing `;` is how Jupyter/IPython suppresses auto-display of a
# cell's last expression (e.g. to hide a plot call's Axes repr) -- meaningful here, unlike scripts.
"notebooks/*" = ["E501", "B018", "E703"]

[tool.mypy]
# Matches the actual interpreter this project runs under (confirmed 3.13.13 in the Docker image),
# not `requires-python`'s 3.11 floor (set only for stdlib tomllib) -- numpy's own bundled stubs use
# 3.12+ syntax (PEP 695 type statements) that mypy can't parse when python_version is set below
# that, regardless of this project's own code.
python_version = "3.13"
warn_redundant_casts = true
warn_unused_ignores = true
warn_unused_configs = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["spiceypy.*", "rasterio.*", "pandas.*", "geopandas.*", "shapely.*", "pvl.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# cv2 ships its own bundled stubs (so it isn't a "missing imports" case `ignore_missing_imports`
# above would fix) but they're incomplete/inconsistent enough with the real runtime API (confirmed:
# a real `SIFT_create` attr-defined error and several cascading arg-type errors from functions that
# genuinely exist and work at runtime) to be actively misleading rather than helpful here --
# `follow_imports = "skip"` treats the whole module as untyped `Any` instead, same practical effect
# as `ignore_missing_imports` but for a "found, wrong stubs" module rather than a "not found" one.
module = ["cv2.*"]
follow_imports = "skip"

[[tool.mypy.overrides]]
# lightglue ships no stubs at all (a real "module not found" case, unlike cv2's above); torch ships
# its own but mypy still can't fully resolve some of its internal generic/C-extension-backed types
# from this project's call sites -- `ignore_missing_imports` covers both uniformly. Only the modules
# this project imports directly (torch, lightglue) need an entry here -- torchvision/kornia are
# real transitive runtime dependencies (lightglue's own internals use them) but never imported by
# this project's own code, so mypy never looks at them and an entry for either is flagged "unused".
module = ["torch.*", "lightglue.*"]
ignore_missing_imports = true
